<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light">
<meta name="description" content="Учебные материалы для начальной школы: 2 класс, математика.">
<title>Учебные материалы — 2 класс</title>
<style>
:root{
  color-scheme:light;
  --ink:#16202c; --muted:#64748b; --line:#d7dee8; --card:#fff;
  --bg:#eef2f7; --blue:#2563eb; --blue-d:#1d4ed8; --blue-soft:#eff6ff;
}
*{box-sizing:border-box}
html{font-size:clamp(15px,.35vw + 13.9px,17px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(1100px 520px at 50% -8%,#dbeafe 0%,rgba(219,234,254,0) 62%),
    var(--bg);
  overscroll-behavior-y:none;
}
.page{max-width:1000px;margin:0 auto;padding:clamp(1.2rem,4vw,3rem) clamp(.9rem,4vw,2rem) 4rem}
.hero{text-align:center;margin:0 0 clamp(1.4rem,4vw,2.6rem)}
.kicker{
  display:inline-block;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--blue);background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:.35rem .8rem;margin-bottom:1rem
}
h1{margin:0;font-size:clamp(1.7rem,5vw,2.7rem);line-height:1.1;letter-spacing:-.02em}
.sub{margin:.7rem 0 0;color:var(--muted);font-size:clamp(.95rem,2.4vw,1.08rem)}
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));
  gap:clamp(1rem,2.6vw,1.4rem);align-items:start
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:clamp(1rem,2.8vw,1.5rem);
  box-shadow:0 10px 30px -18px rgba(15,23,42,.35)
}
.grade{
  display:flex;align-items:center;gap:.6rem;margin:0 0 1rem;
  font-size:clamp(1.2rem,3vw,1.45rem);letter-spacing:-.01em
}
.grade::before{content:"";width:.28rem;height:1.4em;border-radius:99px;background:var(--blue);flex:0 0 auto}
.subject-name{
  margin:0 0 .55rem;font-size:.8rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted)
}
.links{display:flex;flex-direction:column;gap:.55rem}
.item{
  display:flex;align-items:center;justify-content:space-between;gap:.9rem;
  padding:clamp(.75rem,2.2vw,1rem) clamp(.85rem,2.4vw,1.1rem);
  border:1px solid var(--line);border-radius:.9rem;background:#f8fafc;
  color:inherit;text-decoration:none;
  transition:background .15s,border-color .15s,transform .15s,box-shadow .15s
}
.item .txt{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.item .title{font-weight:700;font-size:clamp(1rem,2.4vw,1.06rem)}
.item .desc{color:var(--muted);font-size:.86rem;line-height:1.25}
.item .arrow{flex:0 0 auto;font-size:1.1rem;color:var(--blue);transition:transform .15s}
.item:active{transform:translateY(0)}
.item:focus-visible{outline:3px solid #bfdbfe;outline-offset:2px;border-color:var(--blue)}
@media (hover:hover){
  .item:hover{
    border-color:var(--blue);background:var(--blue-soft);transform:translateY(-1px);
    box-shadow:0 10px 20px -16px rgba(37,99,235,.7)
  }
  .item:hover .arrow{transform:translateX(3px)}
}
.soon{
  display:flex;align-items:center;gap:.55rem;margin-top:.9rem;
  padding:clamp(.7rem,2vw,.95rem) clamp(.85rem,2.4vw,1.1rem);
  border:1px dashed var(--line);border-radius:.9rem;color:var(--muted);
  font-size:.92rem;
  background:repeating-linear-gradient(135deg,#fbfcfe,#fbfcfe 10px,#f4f7fb 10px,#f4f7fb 20px)
}
.soon::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:#cbd5e1;flex:0 0 auto}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="kicker">Начальная школа</div>
    <h1>Учебные материалы</h1>
    <p class="sub">Выбери класс и предмет</p>
  </header>

  <nav class="grid" aria-label="Меню разделов">
    <section class="card">
      <h2 class="grade">2 класс</h2>
      <div class="subject-name">Математика</div>
      <div class="links">
        <a class="item" href="math-examples-20.html">
          <span class="txt">
            <span class="title">Раздаточный материал</span>
            <span class="desc">Карточки с примерами для печати</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="item" href="math-trainer.html">
          <span class="txt">
            <span class="title">Примеры</span>
            <span class="desc">Тренажёр сложения и вычитания</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
      <div class="soon">Раздел в разработке</div>
    </section>

    <section class="card">
      <h2 class="grade">3 класс</h2>
      <div class="soon">Раздел в разработке</div>
    </section>
  </nav>
</main>
</body>
</html>
