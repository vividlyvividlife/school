<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Примеры до 20 с переходом через 10 — печать</title>
<style>
:root{ --line:#1b1b1b; --ink:#1b1b1b; --muted:#6b7280; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ font-family:"Segoe UI",Roboto,Arial,sans-serif; background:#eef1f5; color:var(--ink); }

/* ---------- панель управления (не печатается) ---------- */
.toolbar{
  position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;
  background:#fff; border-bottom:1px solid #d7dbe2; padding:10px 16px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.fld{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
.fld select,.fld input{
  font:inherit; font-size:14px; color:var(--ink); background:#fff;
  padding:5px 8px; border:1px solid #c6ccd6; border-radius:6px;
}
.fld input[type=number]{ width:84px; }
.btn{
  font:inherit; font-size:14px; font-weight:600; cursor:pointer;
  padding:8px 14px; border:1px solid #c6ccd6; border-radius:6px; background:#fff;
}
.btn:hover{ background:#f3f5f8; }
.btn.primary{ background:#2563eb; border-color:#2563eb; color:#fff; }
.btn.primary:hover{ background:#1d4ed8; }
.hint{ font-size:12px; color:var(--muted); margin-left:auto; max-width:230px; line-height:1.35; }

/* ---------- листы A4 ---------- */
#sheets{ padding:12mm 0 20mm; display:flex; flex-direction:column; align-items:center; gap:8mm; }
.sheet{
  width:210mm; min-height:297mm; background:#fff; padding:12mm;
  box-shadow:0 2px 10px rgba(16,24,40,.12);
  display:flex; flex-direction:column;
}
.sheet-head{ display:flex; align-items:baseline; gap:10mm; font-size:12pt; margin-bottom:6mm; flex:none; }
.wr{ display:inline-flex; gap:2mm; align-items:baseline; }
.wr .line{ display:inline-block; min-width:34mm; border-bottom:1.5px solid #555; height:1em; }
.wr .line.short{ min-width:20mm; }
.sheet-head .right{ margin-left:auto; color:#555; font-size:10pt; }

/* строки примеров распределяются по всей высоте листа */
.grid{ display:grid; grid-gap:5mm 4mm; gap:5mm 4mm; flex:1 1 auto; align-content:space-between; }

.ex{
  display:flex; align-items:baseline; justify-content:center; gap:.45em;
  font-size:var(--fs,20pt); line-height:1.15; white-space:nowrap;
  font-variant-numeric:tabular-nums; break-inside:avoid;
}
.ex .num{ font-weight:600; }
.ex .op,.ex .eq{ color:#333; }
.blank{
  display:inline-block; width:2.2ch; height:0.98em; vertical-align:-0.1em;
  border:1.6px solid var(--line); border-radius:3px;
}
.ansv{ color:#9aa2b1; font-weight:600; }

/* ---------- лист с ответами ---------- */
.sheet.key h2{ font-size:13pt; margin:0 0 5mm; color:#444; }
.key-cols{ columns:4; column-gap:8mm; font-size:12pt; line-height:1.9; font-variant-numeric:tabular-nums; }
.key-cols div{ break-inside:avoid; }

/* ---------- печать ---------- */
@page{ size:A4 portrait; margin:12mm; }
@media print{
  body{ background:#fff; }
  .toolbar{ display:none !important; }
  #sheets{ padding:0; gap:0; display:block; }
  .sheet{ width:auto; min-height:268mm; padding:0; margin:0; box-shadow:none; page-break-after:always; }
  .sheet:last-child{ page-break-after:auto; }
  .blank{ border-color:#000; }
}
</style>
</head>
<body>

<div class="toolbar">
  <label class="fld">Рядов
    <input id="rows" type="number" min="2" max="20" value="8">
  </label>
  <label class="fld">Столбцов
    <input id="cols" type="number" min="2" max="6" value="3">
  </label>
  <label class="fld">Страниц с примерами
    <input id="pages" type="number" min="1" max="12" value="1">
  </label>
  <label class="fld">Тип примеров
    <select id="type">
      <option value="mix">Сложение и вычитание</option>
      <option value="add">Только сложение +</option>
      <option value="sub">Только вычитание −</option>
    </select>
  </label>
  <label class="fld">Что пропущено
    <select id="miss">
      <option value="r">1. Ответ (8 + 5 = ___)</option>
      <option value="a">2. Первое число (___ + 5 = 13)</option>
      <option value="b">3. Второе число (8 + ___ = 13)</option>
      <option value="ra">1 + 2: ответ и первое</option>
      <option value="rb">1 + 3: ответ и второе</option>
      <option value="ab">2 + 3: первое и второе</option>
      <option value="all">Все три вида</option>
    </select>
  </label>
  <label class="fld">Ответы
    <select id="ans">
      <option value="none">Без ответов</option>
      <option value="faint">Ответы серым (для проверки)</option>
      <option value="key">Отдельный лист-ключ</option>
    </select>
  </label>
  <label class="fld">Ключ варианта
    <input id="seed" type="number" min="1" value="1234">
  </label>
  <button id="again" class="btn" type="button">Другой вариант</button>
  <button id="print" class="btn primary" type="button">Печать</button>
  <div class="hint">Печатайте на A4, масштаб 100 %, поля по умолчанию. Каждый лист — отдельный вариант, примеры на листах не повторяются. Разных примеров одного типа всего 36, поэтому в очень больших вариантах повторы начнутся.</div>
</div>

<div id="sheets"></div>

<script id="logic">
(function(global){
'use strict';

/* --- генератор случайных чисел с ключом: одинаковый ключ = одинаковый вариант --- */
function mulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rnd){
  var a = arr.slice(), i, j, t;
  for(i = a.length - 1; i > 0; i--){ j = Math.floor(rnd() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function clampInt(v, min, max, dflt){
  v = parseInt(v, 10);
  if(!isFinite(v)) return dflt;
  return Math.max(min, Math.min(max, v));
}

/* --- все примеры «с переходом через 10» ---
   сложение:   a + b,  a,b = 2..9,  сумма 11..18   (8+5, 9+9, …)
   вычитание:  m − s,  m = 11..18, s = 2..9, единицы уменьшаемого меньше s (занимаем десяток)  (13−8, 15−7, …) */
function addPool(){
  var out = [], a, b;
  for(a = 2; a <= 9; a++) for(b = 2; b <= 9; b++) if(a + b >= 11 && a + b <= 18) out.push([a, b]);
  return out;
}
function subPool(){
  var out = [], m, s;
  for(m = 11; m <= 18; m++) for(s = 2; s <= 9; s++) if((m % 10) < s) out.push([m, s]);
  return out;
}
/* выдаёт пачку из n примеров на лист так, чтобы:
   — внутри листа не было повторов;
   — раньше остальных шли примеры, которых ещё не было в текущем круге и не было на прошлом листе;
   — круг из всех 36 примеров прокручивался целиком, прежде чем что-то повторится;
   — при одном и том же ключе варианта порядок всегда одинаковый. */
function makeDrawer(items, rnd){
  var used = new Set(), prev = new Set();
  function key(x){ return x[0] + '|' + x[1]; }

  return function(take){
    var i, k, x, t1 = [], t2 = [], t3 = [], t4 = [];
    if(used.size >= items.length){ used = new Set(); }    /* круг прокручен — начинаем новый */
    var ord = shuffle(items, rnd);
    for(i = 0; i < ord.length; i++){
      k = key(ord[i]);
      if(!used.has(k) && !prev.has(k))       t1.push(ord[i]);
      else if(!used.has(k))                  t2.push(ord[i]);
      else if(!prev.has(k))                  t3.push(ord[i]);
      else                                   t4.push(ord[i]);
    }
    ord = t1.concat(t2, t3, t4);

    var out = [];
    for(i = 0; i < take; i++){
      if(i >= ord.length){                               /* примеров на листе больше 36 — добавляем ещё круг */
        var next = shuffle(items, rnd);
        if(out.length && next.length > 1 && key(next[0]) === key(out[out.length - 1])){
          x = next[0]; next[0] = next[1]; next[1] = x;   /* не ставим одинаковые примеры подряд */
        }
        ord = ord.concat(next);
      }
      out.push(ord[i]);
      used.add(key(ord[i]));
    }
    prev = new Set(out.map(key));
    return out;
  };
}
function typeSequence(n, type, rnd){
  var arr = [], half, k;
  if(type === 'add' || type === 'sub'){
    for(k = 0; k < n; k++) arr.push(type === 'add' ? '+' : '-');
    return arr;
  }
  half = Math.round(n / 2);
  for(k = 0; k < n; k++) arr.push(k < half ? '+' : '-');
  return shuffle(arr, rnd);
}
/* что пропущено в примере: 'r' — ответ (8 + 5 = __), 'a' — первое число (__ + 5 = 13),
   'b' — второе (8 + __ = 13). Комбинации: 'ra', 'rb', 'ab', 'all' (все три) — виды чередуются поровну. */
function missKinds(miss){
  var s = (miss === 'all') ? 'rab' : String(miss || 'r');
  var out = '', i, ch;
  for(i = 0; i < s.length; i++){
    ch = s.charAt(i);
    if('rab'.indexOf(ch) >= 0 && out.indexOf(ch) < 0) out += ch;
  }
  return out.length ? out : 'r';
}
function missSequence(n, miss, rnd){
  var kinds = missKinds(miss), arr = [], i;
  for(i = 0; i < n; i++) arr.push(kinds.charAt(i % kinds.length));
  return shuffle(arr, rnd);
}

function makeVariant(opts){
  opts = opts || {};
  var rows  = clampInt(opts.rows, 2, 20, 8);
  var cols  = clampInt(opts.cols, 2, 6, 3);
  var pages = clampInt(opts.pages, 1, 12, 1);
  var type  = (opts.type === 'add' || opts.type === 'sub') ? opts.type : 'mix';
  var miss  = missKinds(opts.miss);
  var seed  = clampInt(opts.seed, 1, 4294967295, 1);
  var rnd   = mulberry32(seed);
  var nextAdd = makeDrawer(addPool(), rnd);
  var nextSub = makeDrawer(subPool(), rnd);
  var per = rows * cols;
  var sheets = [], p, k, seq, mseq, items, pair, adds, addItems, subItems, ai, si;
  for(p = 0; p < pages; p++){
    seq = typeSequence(per, type, rnd);
    mseq = missSequence(per, miss, rnd);
    adds = 0;
    for(k = 0; k < per; k++) if(seq[k] === '+') adds++;
    addItems = nextAdd(adds);
    subItems = nextSub(per - adds);
    ai = 0; si = 0; items = [];
    for(k = 0; k < per; k++){
      if(seq[k] === '+'){
        pair = addItems[ai++];
        items.push({ op:'+', a:pair[0], b:pair[1], r:pair[0] + pair[1], miss:mseq[k] });
      } else {
        pair = subItems[si++];
        items.push({ op:'−', a:pair[0], b:pair[1], r:pair[0] - pair[1], miss:mseq[k] });
      }
    }
    sheets.push(items);
  }
  return { rows:rows, cols:cols, pages:pages, type:type, miss:miss, seed:seed, per:per, sheetPages:sheets };
}

/* --- размер шрифта: ширина ячейки на A4 (186 мм полезной ширины) важнее высоты --- */
function fontSizePt(cols, rows){
  var usableMm = 186, gapMm = 4, padMm = 6;
  var availMm  = 255;                          /* высота под примеры: A4 − поля − шапка */
  var cellMm = (usableMm - (cols - 1) * gapMm) / cols;
  var byWidth  = (cellMm - padMm) / 2.33;      /* «8 + 5 = ____» ≈ 6,4 em */
  var byHeight = (availMm - (rows - 1) * 5) / (rows * 0.42);   /* строка ≈ 1,19 em + отступы */
  return Math.max(10, Math.min(30, Math.round(Math.min(byWidth, byHeight))));
}

global.MathSheet = {
  mulberry32: mulberry32,
  makeVariant: makeVariant,
  fontSizePt: fontSizePt,
  addPool: addPool,
  subPool: subPool,
  clampInt: clampInt
};
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var ui = { rows:$('#rows'), cols:$('#cols'), pages:$('#pages'), type:$('#type'), miss:$('#miss'), ans:$('#ans'), seed:$('#seed'), again:$('#again'), print:$('#print'), sheets:$('#sheets') };

function variantLabel(seed, pageIndex, pageCount){
  return pageCount > 1 ? seed + '-' + (pageIndex + 1) : String(seed);
}
function headHTML(pageIndex, pageCount, seed){
  return '<div class="sheet-head">' +
      '<span class="wr">Имя<span class="line"></span></span>' +
      '<span class="wr">Дата<span class="line short"></span></span>' +
      '<span class="right">Вариант ' + variantLabel(seed, pageIndex, pageCount) + '</span>' +
    '</div>';
}
/* пример рисуется по-разному: пропущен ответ, первое число или второе */
function exHTML(item, mode){
  function cell(value, missing){
    if(!missing) return '<span class="num">' + value + '</span>';
    return mode === 'faint' ? '<span class="ansv">' + value + '</span>' : '<span class="blank"></span>';
  }
  return '<div class="ex">' +
      cell(item.a, item.miss === 'a') +
      '<span class="op">' + item.op + '</span>' +
      cell(item.b, item.miss === 'b') +
      '<span class="eq">=</span>' +
      cell(item.r, item.miss === 'r') +
    '</div>';
}
function keyHTML(item){
  return '<div>' + item.a + ' ' + item.op + ' ' + item.b + ' = ' + item.r + '</div>';
}

function render(){
  var variant = MathSheet.makeVariant({
    rows: ui.rows.value, cols: ui.cols.value, pages: ui.pages.value,
    type: ui.type.value, miss: ui.miss.value, seed: ui.seed.value
  });
  var fs = MathSheet.fontSizePt(variant.cols, variant.rows);
  var mode = ui.ans.value;
  var parts = [];

  variant.sheetPages.forEach(function(items, i){
    parts.push('<section class="sheet">' +
      headHTML(i, variant.pages, variant.seed) +
      '<div class="grid" style="grid-template-columns:repeat(' + variant.cols + ',1fr);--fs:' + fs + 'pt">' +
        items.map(function(it){ return exHTML(it, mode); }).join('') +
      '</div>' +
    '</section>');
  });

  if(mode === 'key'){
    variant.sheetPages.forEach(function(items, i){
      parts.push('<section class="sheet key">' +
        headHTML(i, variant.pages, variant.seed) +
        '<h2>Ответы к варианту ' + variantLabel(variant.seed, i, variant.pages) + '</h2>' +
        '<div class="key-cols">' + items.map(keyHTML).join('') + '</div>' +
      '</section>');
    });
  }
  ui.sheets.innerHTML = parts.join('');
}

['rows','cols','pages','type','miss','ans','seed'].forEach(function(id){
  ui[id].addEventListener('input', render);
  ui[id].addEventListener('change', render);
});
ui.again.addEventListener('click', function(){
  ui.seed.value = 1000 + Math.floor(Math.random() * 9000);
  render();
});
ui.print.addEventListener('click', function(){ window.print(); });

/* настройки можно задать прямо в ссылке:
   math-examples-20.html?rows=8&cols=3&pages=2&type=add&miss=all&ans=key&seed=1234 */
function applyUrlParams(){
  var q = {};
  (location.search || '').replace(/^\?/, '').split('&').forEach(function(kv){
    if(!kv) return;
    var p = kv.split('=');
    q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
  });
  ['rows','cols','pages','type','miss','ans','seed'].forEach(function(id){
    if(q[id] !== undefined && q[id] !== '') ui[id].value = q[id];
  });
}

applyUrlParams();
if(!/^\d+$/.test(ui.seed.value)) ui.seed.value = 1000 + Math.floor(Math.random() * 9000);
render();
})();
</script>

</body>
</html>
